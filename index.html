<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Form</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <script src="assets/js/script.js" defer></script>
</head>

<body>
    <div class="container">
        <div class="logo-container">
            <div class="banner">
                <div class="logo">
                    <img src="assets/images/odin-lined.png" class="logo-image">
                    <h1 class="logo-name">ODIN</h1>
                </div>
            </div>
            <div class="attribution">
                Photo by
                <a
                    href="https://unsplash.com/@huguesdb?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">
                    Hugues de BUYER-MIMEURE
                </a>
                on
                <a
                    href="https://unsplash.com/photos/purple-petaled-flowers-growing-at-the-mountain-during-sunrise-lQPEChtLjUo?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">
                    Unsplash
                </a>
            </div>
        </div>

        <div class="form-container">
            <div class="form-top">
                <h1>
                    This is not a real online service! You know you need something like this in your life to help you
                    realize your deepest dreams. Sign up <em>now</em> to get started.
                </h1>
                <h1>You <em>know</em> you want to.</h1>
            </div>


            <div class="form-middle">
                <h1>Let's do this!</h1>
                <form action="" method="post">
                    <div class="left">
                        <div class="form-row">
                            <label for="first-name">FIRST NAME</label>
                            <input type="text" name="first-name" id="first-name" />
                        </div>

                        <div class="form-row">
                            <label for="email">EMAIL</label>
                            <input type="email" name="email" id="email" />
                        </div>

                        <div class="form-row">
                            <label for="password">PASSWORD</label>
                            <input type="password" name="password" id="password" />
                        </div>
                    </div>

                    <div class="right">
                        <div class="form-row">
                            <label for="last-name">LAST NAME</label>
                            <input type="text" name="last-name" id="last-name" />
                        </div>

                        <div class="form-row">
                            <label for="phone-number">PHONE NUMBER</label>
                            <input type="text" name="phone-number" id="phone-number" inputmode="numeric" />
                        </div>

                        <div class="form-row">
                            <label for="confirm-password">CONFIRM PASSWORD</label>
                            <input type="password" name="confirm-password" id="confirm-password" />
                        </div>
                    </div>
                </form>
            </div>

            <div class="form-bottom">
                <button>Create Account</button>
                <p>Already have an account? <a href="">Log in</a></p>
            </div>
        </div>
    </div>
</body>

</html>
